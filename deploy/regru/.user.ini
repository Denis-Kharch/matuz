; Лимиты PHP для админки на хостинге reg.ru (кладётся в папку сайта рядом с app.php).
; Фото до 15 МБ + запас на остальные поля формы; нарезка фото и публикация сайта — память и время.
upload_max_filesize = 16M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 120
; Без «коротких тегов»: иначе «<?xml» в шаблонах PHP принимает за код.
short_open_tag = Off
