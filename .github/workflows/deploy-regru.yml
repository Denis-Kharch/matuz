name: Deploy to reg.ru hosting

# Сборка под https://matuzov.ru и выгрузка на хостинг reg.ru.
# Способ — переменная репозитория REGRU_DEPLOY: 'ftp' (логин/пароль FTP, только через шифрованный FTPS)
# или 'ssh' (ключ). Пусто — выгрузка выключена.
# Секреты:
#   REGRU_HOST      — адрес сервера (например server123.hosting.reg.ru)
#   REGRU_USER      — логин FTP/хостинга (u1234567)
#   REGRU_PATH      — папка сайта на хостинге (например www/matuzov.ru)
#   REGRU_PASSWORD  — пароль FTP (для ftp)
#   REGRU_SSH_KEY   — приватный SSH-ключ (для ssh)
# Необязательные переменные: REGRU_SSH_PORT (22), SITE_PREVIEW ('true' = закрыть от поисковиков, по умолчанию 'true').

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regru
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.REGRU_DEPLOY == 'ftp' || vars.REGRU_DEPLOY == 'ssh' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://matuzov.ru
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, mbstring, fileinfo
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          cp .env.example .env
          php artisan key:generate --force

      - name: Images and assets
        env:
          ASSET_URL: ${{ env.SITE_URL }}
        run: |
          npm run images
          npm run build

      - name: Export static site
        env:
          APP_URL: ${{ env.SITE_URL }}
          ASSET_URL: ${{ env.SITE_URL }}
          APP_ENV: production
          APP_DEBUG: 'false'
          SITE_PREVIEW: ${{ vars.SITE_PREVIEW || 'true' }}
        run: php artisan site:export --out=dist

      - name: Check export
        run: node scripts/check-export.mjs dist "$SITE_URL"

      # .nojekyll нужен только GitHub Pages; на хостинге вместо него — .htaccess для Apache.
      - name: Prepare for reg.ru
        run: |
          rm -f dist/.nojekyll
          cp deploy/regru/.htaccess dist/.htaccess
          # Метка «здесь лежит наш сайт»: только в папке с этой меткой разрешено удалять лишние файлы.
          echo "matuzov.ru static site — managed by GitHub Actions (deploy-regru.yml)" > dist/.matuzov-deploy

      - name: Upload via FTPS (lftp mirror)
        if: ${{ vars.REGRU_DEPLOY == 'ftp' }}
        env:
          FTP_HOST: ${{ secrets.REGRU_HOST }}
          FTP_USER: ${{ secrets.REGRU_USER }}
          LFTP_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          FTP_TARGET: ${{ secrets.REGRU_PATH }}
        run: |
          # Случайные пробелы и переносы строк при вставке секретов: у адреса, логина и папки убираем все пробельные символы
          # по краям, у пароля — только переносы строк.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          FTP_HOST="$(trim "$FTP_HOST")"; FTP_USER="$(trim "$FTP_USER")"; FTP_TARGET="$(trim "$FTP_TARGET")"
          export LFTP_PASSWORD="$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')"
          for v in FTP_HOST FTP_USER LFTP_PASSWORD FTP_TARGET; do [ -n "${!v}" ] || { echo "Нет секрета для $v"; exit 1; }; done
          # Самопроверка формата (без вывода самих значений): помогает понять, какой секрет заполнен неверно.
          echo "Логин: ${#FTP_USER} симв., вида u1234567: $([[ "$FTP_USER" =~ ^u[0-9]+$ ]] && echo да || echo НЕТ)"
          echo "Пароль: ${#LFTP_PASSWORD} симв., пробелы внутри: $([[ "$LFTP_PASSWORD" == *" "* ]] && echo ЕСТЬ || echo нет)"
          echo "Сервер вида *.hosting.reg.ru: $([[ "$FTP_HOST" =~ \.hosting\.reg\.ru$ ]] && echo да || echo НЕТ), с ftp:// или http: $([[ "$FTP_HOST" == *://* ]] && echo ДА || echo нет)"
          echo "Папка начинается с /: $([[ "$FTP_TARGET" == /* ]] && echo да || echo нет)"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Только шифрованный FTPS с проверкой сертификата: пароль и файлы не уходят открытым текстом.
          # Если сервер не поддерживает FTPS — выгрузка падает с ошибкой (лучше, чем отправить пароль в открытую).
          # Пароль берётся из переменной окружения LFTP_PASSWORD (--env-password): в файл команд и логи он не попадает.
          cat > "$RUNNER_TEMP/connect.lftp" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          EOF

          # Защита: смотрим, что лежит в целевой папке ДО загрузки.
          { cat "$RUNNER_TEMP/connect.lftp"; echo "cls -1a \"$FTP_TARGET/\""; echo bye; } > "$RUNNER_TEMP/list.lftp"
          lftp -f "$RUNNER_TEMP/list.lftp" > "$RUNNER_TEMP/listing.txt" 2>/dev/null || true
          sed -i 's#/$##; s#^.*/##' "$RUNNER_TEMP/listing.txt"
          # 1) Служебные папки хостинга → это корень хостинга, а не папка сайта: останавливаемся, ничего не трогая.
          if grep -qxE 'php-bin.*|logs|www|bin-tmp|\.fmsettings|\.ssh|\.bash_profile|\.bashrc|\.cache|tmp' "$RUNNER_TEMP/listing.txt"; then
            echo "::error::Папка выгрузки похожа на корень хостинга (там служебные папки). Укажите в REGRU_PATH папку сайта, например www/matuzov.ru. Ничего не загружено и не удалено."
            exit 1
          fi
          # 2) Удалять лишние файлы — только там, где уже лежит метка нашего сайта. Иначе только добавляем.
          if grep -qx '\.matuzov-deploy' "$RUNNER_TEMP/listing.txt"; then
            DELETE=--delete; echo "Метка сайта найдена: устаревшие файлы будут удалены."
          else
            DELETE=; echo "Метки сайта нет (первая выгрузка в эту папку): только добавляем файлы, ничего не удаляем."
          fi

          { cat "$RUNNER_TEMP/connect.lftp"
            echo "mirror --reverse $DELETE --only-newer --parallel=4 --verbose=1 --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .user.ini dist/ \"$FTP_TARGET/\""
            echo bye; } > "$RUNNER_TEMP/deploy.lftp"
          lftp -f "$RUNNER_TEMP/deploy.lftp"
          echo "Готово: $SITE_URL"

      - name: Upload via SSH (rsync)
        if: ${{ vars.REGRU_DEPLOY == 'ssh' }}
        env:
          SSH_KEY: ${{ secrets.REGRU_SSH_KEY }}
          SSH_HOST: ${{ secrets.REGRU_HOST }}
          SSH_USER: ${{ secrets.REGRU_USER }}
          SSH_TARGET: ${{ secrets.REGRU_PATH }}
          SSH_PORT: ${{ vars.REGRU_SSH_PORT || '22' }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SSH_HOST="$(trim "$SSH_HOST")"; SSH_USER="$(trim "$SSH_USER")"; SSH_TARGET="$(trim "$SSH_TARGET")"
          for v in SSH_KEY SSH_HOST SSH_USER SSH_TARGET; do [ -n "${!v}" ] || { echo "Нет секрета для $v"; exit 1; }; done
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_deploy -p $SSH_PORT"
          # Та же защита, что и для FTP: корень хостинга — стоп; удаление лишнего — только при метке сайта.
          LISTING="$($SSH "$SSH_USER@$SSH_HOST" "ls -1A \"$SSH_TARGET\" 2>/dev/null" || true)"
          if printf '%s\n' "$LISTING" | grep -qxE 'php-bin.*|logs|www|bin-tmp|\.fmsettings|\.ssh|\.bash_profile|\.bashrc|\.cache|tmp'; then
            echo "::error::Папка выгрузки похожа на корень хостинга. Укажите в REGRU_PATH папку сайта. Ничего не загружено и не удалено."
            exit 1
          fi
          DELETE=; printf '%s\n' "$LISTING" | grep -qx '\.matuzov-deploy' && DELETE=--delete
          rsync -az $DELETE \
            --exclude='.well-known/' --exclude='cgi-bin/' --exclude='.user.ini' \
            -e "$SSH" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET/"
          echo "Готово: $SITE_URL"
