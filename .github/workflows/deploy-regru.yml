name: Deploy to reg.ru hosting

# Сборка под https://matuzov.ru и выгрузка на хостинг reg.ru.
# Способ — переменная репозитория REGRU_DEPLOY: 'ftp' (логин/пароль FTP, только через шифрованный FTPS)
# или 'ssh' (ключ). Пусто — выгрузка выключена.
# Секреты:
#   REGRU_HOST      — адрес сервера (например server123.hosting.reg.ru)
#   REGRU_USER      — логин FTP/хостинга (u1234567)
#   REGRU_PATH      — папка сайта на хостинге (например www/matuzov.ru)
#   REGRU_PASSWORD  — пароль FTP (для ftp)
#   REGRU_SSH_KEY   — приватный SSH-ключ (для ssh)
# Необязательные переменные: REGRU_SSH_PORT (22), SITE_PREVIEW ('true' = закрыть от поисковиков, по умолчанию 'true').

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: regru
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.REGRU_DEPLOY == 'ftp' || vars.REGRU_DEPLOY == 'ssh' }}
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://matuzov.ru
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, mbstring, fileinfo
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          cp .env.example .env
          php artisan key:generate --force

      - name: Images and assets
        env:
          ASSET_URL: ${{ env.SITE_URL }}
        run: |
          npm run images
          npm run build

      - name: Export static site
        env:
          APP_URL: ${{ env.SITE_URL }}
          ASSET_URL: ${{ env.SITE_URL }}
          APP_ENV: production
          APP_DEBUG: 'false'
          SITE_PREVIEW: ${{ vars.SITE_PREVIEW || 'true' }}
        run: php artisan site:export --out=dist

      - name: Check export
        run: node scripts/check-export.mjs dist "$SITE_URL"

      # .nojekyll нужен только GitHub Pages; на хостинге вместо него — .htaccess для Apache.
      - name: Prepare for reg.ru
        run: |
          rm -f dist/.nojekyll
          cp deploy/regru/.htaccess dist/.htaccess

      - name: Upload via FTPS (lftp mirror)
        if: ${{ vars.REGRU_DEPLOY == 'ftp' }}
        env:
          FTP_HOST: ${{ secrets.REGRU_HOST }}
          FTP_USER: ${{ secrets.REGRU_USER }}
          LFTP_PASSWORD: ${{ secrets.REGRU_PASSWORD }}
          FTP_TARGET: ${{ secrets.REGRU_PATH }}
        run: |
          for v in FTP_HOST FTP_USER LFTP_PASSWORD FTP_TARGET; do [ -n "${!v}" ] || { echo "Нет секрета для $v"; exit 1; }; done
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Только шифрованный FTPS с проверкой сертификата: пароль и файлы не уходят открытым текстом.
          # Если сервер не поддерживает FTPS — выгрузка падает с ошибкой (лучше, чем отправить пароль в открытую).
          # Пароль берётся из переменной окружения LFTP_PASSWORD (--env-password): в файл команд и логи он не попадает.
          # Загружаются только изменённые файлы, лишние удаляются; служебные папки хостинга не трогаем.
          cat > "$RUNNER_TEMP/deploy.lftp" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u "$FTP_USER" "$FTP_HOST"
          mirror --reverse --delete --only-newer --parallel=4 --verbose=1 --exclude-glob .well-known/ --exclude-glob cgi-bin/ --exclude-glob .user.ini dist/ "$FTP_TARGET/"
          bye
          EOF
          lftp -f "$RUNNER_TEMP/deploy.lftp"
          echo "Готово: $SITE_URL"

      - name: Upload via SSH (rsync)
        if: ${{ vars.REGRU_DEPLOY == 'ssh' }}
        env:
          SSH_KEY: ${{ secrets.REGRU_SSH_KEY }}
          HOST: ${{ secrets.REGRU_HOST }}
          USER: ${{ secrets.REGRU_USER }}
          TARGET: ${{ secrets.REGRU_PATH }}
          PORT: ${{ vars.REGRU_SSH_PORT || '22' }}
        run: |
          for v in SSH_KEY HOST USER TARGET; do [ -n "${!v}" ] || { echo "Нет секрета для $v"; exit 1; }; done
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # --delete убирает старые файлы сайта; служебные папки хостинга не трогаем
          rsync -az --delete \
            --exclude='.well-known/' --exclude='cgi-bin/' --exclude='.user.ini' \
            -e "ssh -i ~/.ssh/id_deploy -p $PORT" \
            dist/ "$USER@$HOST:$TARGET/"
          echo "Готово: $SITE_URL"
