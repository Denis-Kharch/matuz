name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, mbstring, fileinfo
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Site URL
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "SITE_URL=https://${OWNER,,}.github.io/${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: Install
        run: |
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          npm ci
          cp .env.example .env
          php artisan key:generate --force

      - name: Images and assets
        env:
          ASSET_URL: ${{ env.SITE_URL }}
        run: |
          npm run images
          npm run build

      - name: Export static site
        env:
          APP_URL: ${{ env.SITE_URL }}
          ASSET_URL: ${{ env.SITE_URL }}
          APP_ENV: production
          APP_DEBUG: 'false'
          SITE_PREVIEW: 'true'
        run: php artisan site:export --out=dist

      - name: Check export
        run: node scripts/check-export.mjs dist "$SITE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
